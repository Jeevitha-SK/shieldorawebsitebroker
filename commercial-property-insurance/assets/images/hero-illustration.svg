<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a3d91" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="bldgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bldgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#0247fe" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="shadowCard" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="300" cy="250" r="230" fill="url(#bgGlow)" />
  
  <!-- Grid Lines / Modern architectural wireframe lines -->
  <path d="M50 420 L550 420" stroke="#cbd5e1" stroke-width="2" />
  <path d="M100 420 L100 80" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M200 420 L200 60" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M300 420 L300 40" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M400 420 L400 80" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
  <path d="M500 420 L500 120" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Commercial Buildings Silhouette -->
  <!-- Building 1 (Left Warehouse / Tech Hub) -->
  <rect x="70" y="240" width="110" height="180" rx="4" fill="url(#bldgGrad2)" />
  <!-- Windows -->
  <g fill="#38bdf8" opacity="0.6">
    <rect x="85" y="260" width="16" height="12" rx="2" />
    <rect x="115" y="260" width="16" height="12" rx="2" />
    <rect x="145" y="260" width="16" height="12" rx="2" />
    <rect x="85" y="290" width="16" height="12" rx="2" />
    <rect x="115" y="290" width="16" height="12" rx="2" />
    <rect x="145" y="290" width="16" height="12" rx="2" />
    <rect x="85" y="320" width="16" height="12" rx="2" />
    <rect x="115" y="320" width="16" height="12" rx="2" />
    <rect x="145" y="320" width="16" height="12" rx="2" />
    <rect x="85" y="350" width="16" height="12" rx="2" />
    <rect x="115" y="350" width="16" height="12" rx="2" />
    <rect x="145" y="350" width="16" height="12" rx="2" />
  </g>

  <!-- Building 2 (Tower Center) -->
  <rect x="210" y="110" width="150" height="310" rx="6" fill="url(#bldgGrad1)" />
  <!-- Spire -->
  <polygon points="280,60 290,110 270,110" fill="#0d6efd" />
  <line x1="280" y1="35" x2="280" y2="60" stroke="#0d6efd" stroke-width="3" />
  <!-- Center Tower Glass Facade Grid -->
  <g fill="#93c5fd" opacity="0.45">
    <rect x="230" y="130" width="22" height="16" rx="2" />
    <rect x="260" y="130" width="22" height="16" rx="2" />
    <rect x="290" y="130" width="22" height="16" rx="2" />
    <rect x="320" y="130" width="22" height="16" rx="2" />

    <rect x="230" y="160" width="22" height="16" rx="2" />
    <rect x="260" y="160" width="22" height="16" rx="2" fill="#38bdf8" opacity="0.9" />
    <rect x="290" y="160" width="22" height="16" rx="2" />
    <rect x="320" y="160" width="22" height="16" rx="2" />

    <rect x="230" y="190" width="22" height="16" rx="2" />
    <rect x="260" y="190" width="22" height="16" rx="2" />
    <rect x="290" y="190" width="22" height="16" rx="2" />
    <rect x="320" y="190" width="22" height="16" rx="2" />

    <rect x="230" y="220" width="22" height="16" rx="2" />
    <rect x="260" y="220" width="22" height="16" rx="2" />
    <rect x="290" y="220" width="22" height="16" rx="2" fill="#ffb703" opacity="0.9" />
    <rect x="320" y="220" width="22" height="16" rx="2" />

    <rect x="230" y="250" width="22" height="16" rx="2" />
    <rect x="260" y="250" width="22" height="16" rx="2" />
    <rect x="290" y="250" width="22" height="16" rx="2" />
    <rect x="320" y="250" width="22" height="16" rx="2" />

    <rect x="230" y="280" width="22" height="16" rx="2" />
    <rect x="260" y="280" width="22" height="16" rx="2" />
    <rect x="290" y="280" width="22" height="16" rx="2" />
    <rect x="320" y="280" width="22" height="16" rx="2" />

    <rect x="230" y="310" width="22" height="16" rx="2" />
    <rect x="260" y="310" width="22" height="16" rx="2" />
    <rect x="290" y="310" width="22" height="16" rx="2" />
    <rect x="320" y="310" width="22" height="16" rx="2" />
  </g>

  <!-- Building 3 (Right Financial Center) -->
  <rect x="380" y="170" width="130" height="250" rx="4" fill="url(#bldgGrad2)" />
  <g fill="#bae6fd" opacity="0.5">
    <rect x="400" y="195" width="22" height="14" rx="2" />
    <rect x="435" y="195" width="22" height="14" rx="2" />
    <rect x="470" y="195" width="22" height="14" rx="2" />
    <rect x="400" y="225" width="22" height="14" rx="2" />
    <rect x="435" y="225" width="22" height="14" rx="2" />
    <rect x="470" y="225" width="22" height="14" rx="2" />
    <rect x="400" y="255" width="22" height="14" rx="2" />
    <rect x="435" y="255" width="22" height="14" rx="2" />
    <rect x="470" y="255" width="22" height="14" rx="2" />
    <rect x="400" y="285" width="22" height="14" rx="2" />
    <rect x="435" y="285" width="22" height="14" rx="2" />
    <rect x="470" y="285" width="22" height="14" rx="2" />
  </g>

  <!-- Floating Badge 1: 100% Comprehensive Shield -->
  <g filter="url(#shadowCard)" transform="translate(40, 120)">
    <rect width="170" height="68" rx="12" fill="#ffffff" />
    <circle cx="34" cy="34" r="20" fill="#e0f2fe" />
    <path d="M34 22 L44 26 V34 C44 40 39 44 34 46 C29 44 24 40 24 34 V26 Z" fill="#0284c7" />
    <path d="M30 33 L33 36 L39 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="29" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">A-Rated Insurers</text>
    <text x="64" y="46" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b">100% Backed</text>
  </g>

  <!-- Floating Badge 2: Fast Claims Metric -->
  <g filter="url(#shadowCard)" transform="translate(360, 310)">
    <rect width="195" height="74" rx="12" fill="#ffffff" />
    <circle cx="36" cy="37" r="20" fill="#fef3c7" />
    <path d="M36 25 V37 L44 41" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
    <text x="68" y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">CLAIMS SPEED</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">24-48 Hr Action</text>
  </g>

  <!-- Floating Badge 3: Insured Value -->
  <g filter="url(#shadowCard)" transform="translate(200, 360)">
    <rect width="180" height="62" rx="12" fill="#0f172a" />
    <circle cx="32" cy="31" r="16" fill="url(#goldGrad)" />
    <text x="32" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">$</text>
    <text x="58" y="26" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">PORTFOLIO COVERED</text>
    <text x="58" y="46" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">$4.8 Billion+</text>
  </g>
</svg>
